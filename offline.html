    h1 { font-size: 21px; margin: 18px 0 6px; }
    p { margin: 0 0 20px; color: var(--muted); }
    button { border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 700; font-size: 15px; cursor: pointer;
      background: var(--text); color: var(--bg); }
    .contact { margin-top: 20px; font-size: 13px; color: var(--muted); }
    .contact a { color: var(--gold); font-weight: 600; text-decoration: none; }
