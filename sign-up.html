    /* OTP Modal */
    #hl-otp-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .55);
    }

    #hl-otp-modal.hl-otp-open {
      display: flex;
    }

    .hl-otp-box {
      background: #fff;
      border-radius: 18px;
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .18);
      text-align: center;
      animation: hlOtpIn .2s ease;
    }

    @keyframes hlOtpIn {
      from {
        opacity: 0;
        transform: scale(.94) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .hl-otp-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      line-height: 1;
      padding: 4px;
      font-size: 20px;
      transition: color .15s;
    }

    .hl-otp-close:hover {
      color: #222;
    }

    .hl-otp-icon {
      width: 56px;
      height: 56px;
      background: #f0f5ea;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

      color: #222;
    }

    .hl-otp-input {
      width: 100%;
      text-align: center;
      font-size: 28px;
      border-radius: 999px;
      letter-spacing: 12px;
      font-weight: 700;
      border: 1px solid #d0d8c8;
      border-radius: 10px;
      padding: 14px 10px;
      outline: none;
      transition: border-color .15s;
      box-sizing: border-box;
      border-radius: 999px;
    }

    .hl-otp-input:focus {
      border-color: #9d8248;
    }

    .hl-otp-verify-btn {
      z-index: 5;
      margin-top: 18px;
      background-color: var(--dark-gray);
      color: var(--gray-30);
      text-align: center;
      white-space: nowrap;
      border-radius: 100px;
      justify-content: center;
      align-items: center;
      padding: 16px 32px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color .2s;
      display: flex;
      position: relative;
      width: 100%;
    }

    .hl-otp-verify-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .hl-otp-verify-btn:not(:disabled):hover {
      background: #334420;
    }

    .hl-otp-resend-row {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
    }

    .hl-otp-resend-btn {
      background: none;
      border: none;
      color: #9d8248;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      transition: color .15s;
    }

    .hl-otp-resend-btn:disabled {
      color: #999;
      cursor: not-allowed;
      text-decoration: none;
    }

    .hl-otp-msg {
      margin-top: 12px;
      font-size: 13px;
      border-radius: 7px;
      padding: 9px 12px;
      display: none;
    }

    .hl-otp-msg.success {
      background: #eaf4e4;
      color: #2d6a1f;
      display: block;
    }

    .hl-otp-msg.error {
      background: #fdecea;
      color: #b71c1c;
      display: block;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #8a8a8a;
      font-size: 13px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e4e4e4;
    }

    #hl-google-btn-container {

    (function () {
      document.addEventListener('DOMContentLoaded', function () {
        var signupForm = document.getElementById('wf-form-Sign-Up');
        if (!signupForm) return;

        signupForm.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
          }
        });
      });
    })();

  <script>
    (function () {

      var code = params.get('code');
      if (code) {
        var field = document.getElementById('signup-referralCode');
        if (field) {
          field.value = code.trim();
          field.readOnly = true;
          field.style.background = '#f4f9ec';
          field.style.color = '#9d8248';
          field.style.fontWeight = '600';
          field.style.borderColor = 'rgba(65,83,38,0.35)';
          field.title = 'Referral code applied automatically';
        }
